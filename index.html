<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Med-Affix 医療英語接辞クイズ</title>
<style>
  :root {
    --font-serif: Georgia, 'Times New Roman', serif;
    --font-sans: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Yu Gothic', sans-serif;
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #1e2530;
    --border: #30363d;
    --accent: #00c9a7;
    --accent2: #ff6b6b;
    --accent3: #ffd166;
    --text: #e6edf3;
    --text-muted: #7d8590;
    --correct: #00c9a7;
    --wrong: #ff6b6b;
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,201,167,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,201,167,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }
  #app {
    width: 100%; max-width: 480px; min-height: 100vh;
    display: flex; flex-direction: column;
    position: relative; z-index: 1;
  }
  header {
    padding: 20px 20px 12px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border);
    background: rgba(13,17,23,0.9);
    backdrop-filter: blur(12px);
    position: sticky; top: 0; z-index: 10;
  }
  .logo { font-family: var(--font-serif); font-size: 22px; color: var(--accent); letter-spacing: -0.5px; }
  .logo span { color: var(--text-muted); font-style: italic; font-size: 14px; margin-left: 4px; }
  .stats-bar { display: flex; gap: 12px; font-size: 12px; font-weight: 500; }
  .stat { display: flex; flex-direction: column; align-items: center; gap: 1px; }
  .stat-val { font-size: 16px; font-weight: 600; }
  .stat-val.correct { color: var(--correct); }
  .stat-val.wrong { color: var(--wrong); }
  .stat-val.total { color: var(--accent3); }
  .stat-label { color: var(--text-muted); font-size: 10px; }
  .screen { display: none; flex-direction: column; flex: 1; padding: 24px 20px; animation: fadeIn 0.3s ease; }
  .screen.active { display: flex; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .home-hero { text-align: center; padding: 32px 0 28px; }
  .home-hero .big-title { font-family: var(--font-serif); font-size: 42px; line-height: 1.1; color: var(--text); margin-bottom: 8px; }
  .home-hero .big-title em { color: var(--accent); font-style: italic; }
  .home-hero p { color: var(--text-muted); font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
  .badge-count {
    display: inline-block;
    background: rgba(0,201,167,0.12); border: 1px solid rgba(0,201,167,0.3);
    color: var(--accent); border-radius: 20px; padding: 4px 14px;
    font-size: 13px; font-weight: 500;
  }
  .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .mode-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px 16px;
    cursor: pointer; transition: all 0.2s; text-align: center;
    position: relative; overflow: hidden;
  }
  .mode-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: var(--accent); transform: scaleX(0); transition: transform 0.2s;
  }
  .mode-card:active::before, .mode-card.selected::before { transform: scaleX(1); }
  .mode-card.selected { border-color: var(--accent); background: rgba(0,201,167,0.06); }
  .mode-icon { font-size: 28px; margin-bottom: 8px; }
  .mode-title { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .mode-desc { font-size: 11px; color: var(--text-muted); line-height: 1.4; }
  .difficulty-row { display: flex; gap: 8px; margin-bottom: 20px; }
  .diff-btn {
    flex: 1; padding: 10px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text-muted);
    font-family: var(--font-sans); font-size: 12px; font-weight: 500;
    cursor: pointer; transition: all 0.2s; text-align: center;
  }
  .diff-btn.selected { border-color: var(--accent3); background: rgba(255,209,102,0.08); color: var(--accent3); }
  .start-btn {
    width: 100%; padding: 18px; background: var(--accent);
    color: #0d1117; border: none; border-radius: var(--radius);
    font-family: var(--font-sans); font-size: 16px; font-weight: 700;
    cursor: pointer; transition: all 0.2s; letter-spacing: 0.3px;
  }
  .start-btn:active { transform: scale(0.98); opacity: 0.9; }
  .quiz-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .progress-wrap { flex: 1; height: 4px; background: var(--surface2); border-radius: 2px; overflow: hidden; margin-right: 12px; }
  .progress-bar { height: 100%; background: linear-gradient(90deg, var(--accent), #00e5c8); border-radius: 2px; transition: width 0.4s cubic-bezier(0.4,0,0.2,1); }
  .q-count { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
  .mode-badge { font-size: 10px; padding: 3px 10px; border-radius: 20px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; margin-left: 8px; }
  .mode-badge.en-ja { background: rgba(0,201,167,0.15); color: var(--accent); }
  .mode-badge.ja-en { background: rgba(255,107,107,0.15); color: var(--accent2); }
  .mode-badge.mix { background: rgba(255,209,102,0.15); color: var(--accent3); }
  .question-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 24px; text-align: center;
    margin-bottom: 20px; position: relative; min-height: 140px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .question-card::after {
    content: ''; position: absolute; inset: -1px; border-radius: 20px;
    background: linear-gradient(135deg, rgba(0,201,167,0.1), transparent 50%);
    pointer-events: none;
  }
  .q-direction { font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px; }
  .q-word-wrap { display: flex; align-items: center; gap: 12px; justify-content: center; }
  .q-word { font-family: var(--font-serif); font-size: 36px; line-height: 1.2; color: var(--text); margin: 0; word-break: break-word; }
  .q-word.japanese { font-family: var(--font-sans); font-size: 28px; font-weight: 300; }
  .speak-btn {
    background: rgba(0,201,167,0.15); border: 1.5px solid var(--accent);
    border-radius: 50%; width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 20px; transition: all 0.2s; flex-shrink: 0;
  }
  .speak-btn:active { transform: scale(0.9); }
  .speak-btn.speaking { background: rgba(0,201,167,0.35); animation: pulse-ring 0.7s ease infinite; }
  @keyframes pulse-ring {
    0% { box-shadow: 0 0 0 0 rgba(0,201,167,0.5); }
    70% { box-shadow: 0 0 0 8px rgba(0,201,167,0); }
    100% { box-shadow: 0 0 0 0 rgba(0,201,167,0); }
  }
  .choices-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
  .choice-btn {
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 14px; padding: 16px 12px; color: var(--text);
    font-family: var(--font-sans); font-size: 13px; font-weight: 400;
    cursor: pointer; transition: all 0.15s; text-align: center;
    line-height: 1.4; word-break: break-word; min-height: 64px;
    display: flex; align-items: center; justify-content: center;
  }
  .choice-btn:active:not(:disabled) { transform: scale(0.97); }
  .choice-btn.correct-answer { background: rgba(0,201,167,0.15); border-color: var(--correct); color: var(--correct); font-weight: 600; }
  .choice-btn.wrong-answer { background: rgba(255,107,107,0.12); border-color: var(--wrong); color: var(--wrong); }
  .choice-btn:disabled { cursor: default; }
  .input-wrap { margin-bottom: 20px; }
  .answer-input {
    width: 100%; padding: 16px 18px;
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: var(--radius); color: var(--text);
    font-family: var(--font-sans); font-size: 16px; outline: none;
    transition: border-color 0.2s; margin-bottom: 10px;
  }
  .answer-input:focus { border-color: var(--accent); }
  .answer-input.correct { border-color: var(--correct); background: rgba(0,201,167,0.08); }
  .answer-input.wrong { border-color: var(--wrong); background: rgba(255,107,107,0.08); }
  .submit-btn {
    width: 100%; padding: 14px; background: var(--surface2);
    border: 1.5px solid var(--border); border-radius: var(--radius);
    color: var(--text); font-family: var(--font-sans);
    font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s;
  }
  .submit-btn:active { transform: scale(0.98); }
  .feedback {
    text-align: center; padding: 14px; border-radius: var(--radius);
    margin-bottom: 16px; font-weight: 600; font-size: 15px;
    animation: popIn 0.25s cubic-bezier(0.34,1.56,0.64,1); display: none;
  }
  @keyframes popIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
  .feedback.show { display: block; }
  .feedback.correct { background: rgba(0,201,167,0.15); color: var(--correct); }
  .feedback.wrong { background: rgba(255,107,107,0.12); color: var(--wrong); }
  .correct-word { font-size: 13px; margin-top: 4px; font-weight: 400; }

  /* ── Explanation + Affix box ── */
  .explanation {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 14px; padding: 14px 16px; margin-bottom: 16px;
    font-size: 12px; line-height: 1.6; display: none;
  }
  .explanation.show { display: block; }
  .exp-answer { color: var(--accent); font-weight: 700; font-size: 14px; margin-bottom: 10px; }
  .exp-affix-box {
    background: rgba(0,201,167,0.06); border: 1px solid rgba(0,201,167,0.22);
    border-radius: 10px; padding: 10px 12px;
  }
  .affix-header { font-size: 10px; font-weight: 600; color: var(--text-muted); letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 6px; }
  .affix-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; flex-wrap: wrap; }
  .affix-chip {
    background: rgba(0,201,167,0.18); border: 1px solid rgba(0,201,167,0.45);
    color: var(--accent); border-radius: 6px; padding: 3px 9px;
    font-size: 12px; font-weight: 700; font-family: var(--font-serif);
    white-space: nowrap; letter-spacing: 0.3px;
  }
  .affix-ja { color: var(--text); font-size: 12px; font-weight: 500; }
  .affix-en { color: var(--text-muted); font-size: 11px; padding-left: 2px; }

  .action-row { display: flex; gap: 10px; align-items: stretch; }
  .skip-btn {
    flex: 1; padding: 16px; background: transparent;
    border: 1.5px solid var(--border); border-radius: var(--radius);
    color: var(--text-muted); font-family: var(--font-sans);
    font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s;
  }
  .skip-btn:active { transform: scale(0.98); background: var(--surface2); }
  .skip-btn:disabled { opacity: 0.3; cursor: default; }
  .next-btn {
    flex: 2; padding: 16px; background: var(--surface2);
    border: 1.5px solid var(--border); border-radius: var(--radius);
    color: var(--text); font-family: var(--font-sans);
    font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; display: none;
  }
  .next-btn.show { display: block; animation: fadeIn 0.2s ease; }
  .next-btn:active { transform: scale(0.98); }

  /* result */
  .result-screen { text-align: center; padding: 32px 20px; }
  .result-icon { font-size: 64px; margin-bottom: 16px; animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1); }
  .result-title { font-family: var(--font-serif); font-size: 32px; margin-bottom: 8px; }
  .result-score { font-size: 56px; font-weight: 700; color: var(--accent); margin: 16px 0 4px; font-family: var(--font-serif); }
  .result-sub { color: var(--text-muted); font-size: 14px; margin-bottom: 32px; }
  .result-cards { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 28px; }
  .result-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px 8px; }
  .result-card .val { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
  .result-card .lbl { font-size: 11px; color: var(--text-muted); }
  .result-card.c .val { color: var(--correct); }
  .result-card.w .val { color: var(--wrong); }
  .result-card.r .val { color: var(--accent3); }
  .result-actions { display: flex; flex-direction: column; gap: 10px; }
  .btn-primary { padding: 16px; background: var(--accent); color: #0d1117; border: none; border-radius: var(--radius); font-family: var(--font-sans); font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
  .btn-primary:active { transform: scale(0.98); }
  .btn-secondary { padding: 14px; background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); color: var(--text); font-family: var(--font-sans); font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
  .btn-secondary:active { transform: scale(0.98); }
  .wrong-list-title { font-size: 13px; font-weight: 600; color: var(--text-muted); text-align: left; margin-bottom: 10px; margin-top: 4px; letter-spacing: 0.5px; text-transform: uppercase; }
  .wrong-list { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; margin-bottom: 20px; }
  .wrong-item { display: flex; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--border); align-items: center; gap: 8px; }
  .wrong-item:last-child { border-bottom: none; }
  .wrong-en { font-size: 13px; font-weight: 500; color: var(--accent2); }
  .wrong-ja { font-size: 12px; color: var(--text-muted); text-align: right; }

  /* Home & Confirm */
  .home-icon-btn {
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 10px; color: var(--text-muted); font-size: 18px;
    width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; margin-right: 10px; flex-shrink: 0; transition: all 0.2s;
    line-height: 1; padding: 0; font-family: system-ui;
  }
  .home-icon-btn:active { transform: scale(0.92); background: var(--surface2); }
  .overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.65); z-index: 100; }
  .overlay.show { display: block; }
  .confirm-dialog { display: none; position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 28px 24px 20px; z-index: 101; width: calc(100% - 48px); max-width: 360px; text-align: center; }
  .confirm-dialog.show { display: block; }
  .confirm-icon { font-size: 40px; margin-bottom: 12px; }
  .confirm-title { font-family: var(--font-serif); font-size: 20px; margin-bottom: 6px; }
  .confirm-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }
  .confirm-actions { display: flex; gap: 10px; }
  .confirm-yes { flex: 1; padding: 13px; background: var(--accent2); color: #fff; border: none; border-radius: 12px; font-family: var(--font-sans); font-size: 14px; font-weight: 700; cursor: pointer; }
  .confirm-yes:active { opacity: 0.8; }
  .confirm-no { flex: 1; padding: 13px; background: var(--surface2); border: 1.5px solid var(--border); border-radius: 12px; color: var(--text); font-family: var(--font-sans); font-size: 14px; font-weight: 600; cursor: pointer; }
  .confirm-no:active { opacity: 0.8; }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">Med<em>-</em>Affix <span>医療英語接辞</span></div>
    <div class="stats-bar">
      <div class="stat"><div class="stat-val correct" id="hdr-correct">0</div><div class="stat-label">正解</div></div>
      <div class="stat"><div class="stat-val wrong" id="hdr-wrong">0</div><div class="stat-label">不正解</div></div>
      <div class="stat"><div class="stat-val total" id="hdr-total">0</div><div class="stat-label">累計</div></div>
    </div>
  </header>

  <!-- HOME -->
  <div class="screen active" id="screen-home">
    <div class="home-hero">
      <div class="big-title">Learn<br><em>Medical</em><br>Affixes</div>
      <p>医療英語の接辞（語根・接頭辞・接尾辞）を<br>単語と一緒に効率よく覚えよう</p>
      <div class="badge-count" id="word-count-badge">全 0 語収載</div>
    </div>
    <div style="margin-bottom:12px;">
      <div style="font-size:12px;font-weight:600;color:var(--text-muted);letter-spacing:0.5px;text-transform:uppercase;margin-bottom:10px;">出題モード</div>
      <div class="mode-grid">
        <div class="mode-card selected" data-mode="mix" onclick="selectMode('mix',this)"><div class="mode-icon">🔀</div><div class="mode-title">ミックス</div><div class="mode-desc">英→日と日→英をランダムに出題</div></div>
        <div class="mode-card" data-mode="en-ja" onclick="selectMode('en-ja',this)"><div class="mode-icon">🇺🇸</div><div class="mode-title">英語→日本語</div><div class="mode-desc">英単語を見て日本語を答える</div></div>
        <div class="mode-card" data-mode="ja-en" onclick="selectMode('ja-en',this)"><div class="mode-icon">🇯🇵</div><div class="mode-title">日本語→英語</div><div class="mode-desc">日本語を見て英単語を答える</div></div>
        <div class="mode-card" data-mode="wrong" onclick="selectMode('wrong',this)"><div class="mode-icon">📌</div><div class="mode-title">苦手復習</div><div class="mode-desc">間違えた単語だけを再出題</div></div>
      </div>
    </div>
    <div style="margin-bottom:12px;">
      <div style="font-size:12px;font-weight:600;color:var(--text-muted);letter-spacing:0.5px;text-transform:uppercase;margin-bottom:10px;">回答形式</div>
      <div class="difficulty-row">
        <button class="diff-btn selected" data-type="choice" onclick="selectType('choice',this)">✦ 選択式</button>
        <button class="diff-btn" data-type="input" onclick="selectType('input',this)">✎ 入力式</button>
      </div>
    </div>
    <div style="margin-bottom:20px;">
      <div style="font-size:12px;font-weight:600;color:var(--text-muted);letter-spacing:0.5px;text-transform:uppercase;margin-bottom:10px;">出題数</div>
      <div class="difficulty-row">
        <button class="diff-btn" data-q="10" onclick="selectQ(10,this)">10問</button>
        <button class="diff-btn selected" data-q="20" onclick="selectQ(20,this)">20問</button>
        <button class="diff-btn" data-q="50" onclick="selectQ(50,this)">50問</button>
        <button class="diff-btn" data-q="0" onclick="selectQ(0,this)">全問</button>
      </div>
    </div>
    <button class="start-btn" onclick="startQuiz()">クイズを始める →</button>
  </div>

  <!-- QUIZ -->
  <div class="screen" id="screen-quiz">
    <div class="quiz-meta">
      <button class="home-icon-btn" onclick="confirmHome()" title="ホームへ戻る">&#8592;</button>
      <div class="progress-wrap"><div class="progress-bar" id="progress-bar" style="width:0%"></div></div>
      <div class="q-count" id="q-count">0 / 0</div>
      <div class="mode-badge mix" id="mode-badge">MIX</div>
    </div>
    <div class="question-card">
      <div class="q-direction" id="q-direction">英語 → 日本語</div>
      <div class="q-word-wrap">
        <p class="q-word" id="q-word">word</p>
        <button class="speak-btn" id="speak-btn" onclick="speakWord()" title="発音を再生">🔊</button>
      </div>
    </div>
    <div class="choices-grid" id="choices-wrap">
      <button class="choice-btn" onclick="checkChoice(0)"></button>
      <button class="choice-btn" onclick="checkChoice(1)"></button>
      <button class="choice-btn" onclick="checkChoice(2)"></button>
      <button class="choice-btn" onclick="checkChoice(3)"></button>
    </div>
    <div class="input-wrap" id="input-wrap" style="display:none">
      <input class="answer-input" id="answer-input" type="text" placeholder="答えを入力..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" onkeydown="if(event.key==='Enter')submitInput()">
      <button class="submit-btn" onclick="submitInput()">確認する</button>
    </div>
    <div class="feedback" id="feedback"></div>
    <div class="explanation" id="explanation"></div>
    <div class="action-row" id="action-row">
      <button class="skip-btn" id="skip-btn" onclick="skipQuestion()">スキップ ↷</button>
      <button class="next-btn" id="next-btn" onclick="nextQuestion()">次の問題 →</button>
    </div>
  </div>

  <!-- CONFIRM -->
  <div class="overlay" id="overlay" onclick="closeConfirm()"></div>

// ===================== STATE =====================
let selectedMode = 'mix', selectedType = 'choice', selectedQ = 20;
let quiz = [], qIndex = 0, answered = false;
let currentAnswer = '', currentIsEnJa = true;
let currentAffix = '', currentAffixEn = '', currentAffixJa = '';
let sessionWrongWords = [];
let wrongWords = JSON.parse(localStorage.getItem('affixWrong') || '[]');
let totalCorrect = parseInt(localStorage.getItem('affixTC') || '0');
let totalWrong   = parseInt(localStorage.getItem('affixTW') || '0');

function saveWrongWords() { localStorage.setItem('affixWrong', JSON.stringify(wrongWords)); }
function saveStats(c, w) {
  totalCorrect += c; totalWrong += w;
  localStorage.setItem('affixTC', totalCorrect);
  localStorage.setItem('affixTW', totalWrong);
  document.getElementById('hdr-correct').textContent = totalCorrect;
  document.getElementById('hdr-wrong').textContent = totalWrong;
  document.getElementById('hdr-total').textContent = totalCorrect + totalWrong;
}

// ===================== UI =====================
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
}
function selectMode(m, el) {
  selectedMode = m;
  document.querySelectorAll('.mode-card').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
}
function selectType(t, el) {
  selectedType = t;
  document.querySelectorAll('.diff-btn[data-type]').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
}
function selectQ(n, el) {
  selectedQ = n;
  document.querySelectorAll('.diff-btn[data-q]').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
}
function confirmHome() {
  document.getElementById('overlay').classList.add('show');
  document.getElementById('confirm-dialog').classList.add('show');
}
function closeConfirm() {
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('confirm-dialog').classList.remove('show');
}
function goHome() { closeConfirm(); showScreen('home'); }

// ===================== AUDIO =====================
let currentSpeakWord = '';
let _audioPlayer = null;

/* 単語 → MP3 ファイル名（generate_audio.py と同じルール） */
function wordToFilename(word) {
  return word.toLowerCase().trim()
    .replace(/[^\w\s-]/g, '')
    .replace(/[\s-]+/g, '_') + '.mp3';
}

function speakWord() {
  if (!currentSpeakWord) return;
  const btn = document.getElementById('speak-btn');

  /* ── MP3 再生（audio/ フォルダに音声ファイルがある場合） ── */
  const mp3Path = 'audio/' + wordToFilename(currentSpeakWord);

  if (_audioPlayer) { _audioPlayer.pause(); _audioPlayer = null; }

  const audio = new Audio(mp3Path);
  _audioPlayer = audio;

  btn.classList.add('speaking');

  audio.onended  = () => btn.classList.remove('speaking');
  audio.onerror  = () => {
    /* MP3 が見つからない場合は Web Speech API にフォールバック */
    btn.classList.remove('speaking');
    _fallbackTTS(currentSpeakWord);
  };

  audio.play().catch(() => {
    btn.classList.remove('speaking');
    _fallbackTTS(currentSpeakWord);
  });
}

/* Web Speech API フォールバック（MP3 未生成時） */
function _fallbackTTS(word) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(word);
  utt.lang = 'en-US'; utt.rate = 0.88;
  const btn = document.getElementById('speak-btn');
  btn.classList.add('speaking');
  utt.onend  = () => btn.classList.remove('speaking');
  utt.onerror = () => btn.classList.remove('speaking');
  window.speechSynthesis.speak(utt);
}
function playCorrectSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880; o.type = 'sine';
    g.gain.setValueAtTime(0.18, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
    o.start(ctx.currentTime); o.stop(ctx.currentTime + 0.35);
  } catch(e){}
}
function playWrongSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 260; o.type = 'sawtooth';
    g.gain.setValueAtTime(0.15, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
    o.start(ctx.currentTime); o.stop(ctx.currentTime + 0.4);
  } catch(e){}
}

// ===================== MATCHING =====================
function normalize(s) {
  return s.trim().toLowerCase()
    .replace(/\s+/g,' ')
    .replace(/[（）()・\-\s]/g,'')
    .replace(/[ぁ-ん]/g, c => String.fromCharCode(c.charCodeAt(0)+96));
}
function isJapanese(s) { return /[\u3000-\u9fff]/.test(s); }
function levenshtein(a, b) {
  const m = a.length, n = b.length;
  const dp = Array.from({length:m+1}, (_,i)=>Array.from({length:n+1},(_,j)=>i||j));
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++)
    dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1+Math.min(dp[i-1][j-1],dp[i-1][j],dp[i][j-1]);
  return dp[m][n];
}
function matchesAnswer(user, correct, isEnJa) {
  const uN = normalize(user), cN = normalize(correct);
  if(uN===cN) return true;
  if(isJapanese(correct)) {
    if(levenshtein(uN,cN)<=1) return true;
    for(const seg of correct.split(/[／/・、。]/)) {
      const sN = normalize(seg);
      if(uN===sN) return true;
      if(sN.length>4 && levenshtein(uN,sN)<=1) return true;
    }
    return false;
  } else {
    if(levenshtein(uN,cN)<=2) return true;
    if(correct.includes('/')) for(const p of correct.split('/')) { const pN=normalize(p); if(uN===pN||levenshtein(uN,pN)<=2) return true; }
    return false;
  }
}

// ===================== QUIZ LOGIC =====================
function secureRandom() {
  if(window.crypto&&window.crypto.getRandomValues){const a=new Uint32Array(1);window.crypto.getRandomValues(a);return a[0]/(0xFFFFFFFF+1);}
  return Math.random();
}
function shuffle(arr) {
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(secureRandom()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  for(let i=a.length-1;i>0;i--){const j=Math.floor(secureRandom()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function startQuiz() {
  sessionWrongWords = []; answered = false;
  let pool;
  if(selectedMode==='wrong') {
    if(wrongWords.length===0){alert('苦手単語がまだありません。他のモードで練習してください。');return;}
    pool = wrongWords.map(w=>WORDS.find(x=>x[0]===w)).filter(Boolean);
  } else { pool = [...WORDS]; }
  pool = shuffle(pool);
  if(selectedQ>0) pool = pool.slice(0,selectedQ);
  quiz = pool.map(w=>({word:w,dir:selectedMode==='en-ja'?'en-ja':selectedMode==='ja-en'?'ja-en':'mix'}));
  if(selectedMode==='mix'){
    const half=Math.floor(quiz.length/2);
    const dirs=shuffle([...Array(half).fill('en-ja'),...Array(quiz.length-half).fill('ja-en')]);
    quiz.forEach((q,i)=>q.dir=dirs[i]);
  }
  qIndex = 0;
  showScreen('quiz');
  renderQuestion();
}

function renderQuestion() {
  answered = false;
  const q = quiz[qIndex]; const total = quiz.length;
  document.getElementById('progress-bar').style.width=(qIndex/total*100)+'%';
  document.getElementById('q-count').textContent=`${qIndex+1} / ${total}`;
  const badge=document.getElementById('mode-badge');
  const dir=q.dir==='en-ja'?'en-ja':q.dir==='ja-en'?'ja-en':'mix';
  badge.textContent=dir==='en-ja'?'EN→JA':dir==='ja-en'?'JA→EN':'MIX';
  badge.className='mode-badge '+dir;
  const isEnJa=q.dir==='en-ja';
  document.getElementById('q-direction').textContent=isEnJa?'英語 → 日本語':'日本語 → 英語';
  const qWordEl=document.getElementById('q-word');
  qWordEl.textContent=isEnJa?q.word[0]:q.word[1];
  qWordEl.className='q-word'+(isEnJa?'':' japanese');
  currentSpeakWord=isEnJa?q.word[0]:'';
  document.getElementById('speak-btn').style.display=isEnJa?'flex':'none';
  currentAnswer=isEnJa?q.word[1]:q.word[0];
  currentAffix=q.word[2]; currentAffixEn=q.word[3]; currentAffixJa=q.word[4];
  currentIsEnJa=isEnJa;
  document.getElementById('feedback').className='feedback';
  document.getElementById('explanation').className='explanation';
  document.getElementById('next-btn').className='next-btn';
  document.getElementById('skip-btn').disabled=false;
  if(selectedType==='choice'){
    document.getElementById('choices-wrap').style.display='grid';
    document.getElementById('input-wrap').style.display='none';
    renderChoices(q,isEnJa);
  } else {
    document.getElementById('choices-wrap').style.display='none';
    document.getElementById('input-wrap').style.display='block';
    const inp=document.getElementById('answer-input');
    inp.value=''; inp.className='answer-input'; inp.disabled=false;
    setTimeout(()=>inp.focus(),100);
  }
}

function renderChoices(q,isEnJa){
  const correct=isEnJa?q.word[1]:q.word[0];
  const pool=WORDS.filter(w=>w!==q.word);
  const distractors=shuffle(pool).slice(0,3).map(w=>isEnJa?w[1]:w[0]);
  const options=shuffle([correct,...distractors]);
  document.querySelectorAll('.choice-btn').forEach((b,i)=>{
    b.textContent=options[i]; b.className='choice-btn'; b.disabled=false;
  });
}

function checkChoice(idx){
  if(answered) return; answered=true;
  const btns=document.querySelectorAll('.choice-btn');
  const sel=btns[idx].textContent;
  const ok=matchesAnswer(sel,currentAnswer,currentIsEnJa);
  btns.forEach(b=>{
    b.disabled=true;
    if(matchesAnswer(b.textContent,currentAnswer,currentIsEnJa)) b.classList.add('correct-answer');
  });
  if(!ok){btns[idx].classList.add('wrong-answer');recordWrong();playWrongSound();}
  else{recordCorrect();playCorrectSound();}
  showFeedback(ok);
}

function submitInput(){
  if(answered) return;
  const inp=document.getElementById('answer-input');
  const val=inp.value.trim(); if(!val) return;
  answered=true; inp.disabled=true;
  const ok=matchesAnswer(val,currentAnswer,currentIsEnJa);
  inp.className='answer-input '+(ok?'correct':'wrong');
  if(!ok){recordWrong();playWrongSound();}else{recordCorrect();playCorrectSound();}
  showFeedback(ok);
}

function skipQuestion(){
  if(answered) return;
  recordWrong(); playWrongSound();
  showFeedback(false);
}

function recordCorrect(){saveStats(1,0);}
function recordWrong(){
  const q=quiz[qIndex]; const en=q.word[0];
  sessionWrongWords.push(q.word);
  if(!wrongWords.includes(en)){wrongWords.push(en);saveWrongWords();}
  saveStats(0,1);
}

function showFeedback(isCorrect){
  const fb=document.getElementById('feedback');
  if(isCorrect){fb.innerHTML='✓ 正解！';fb.className='feedback correct show';}
  else{fb.innerHTML=`✗ 不正解<div class="correct-word">正解: ${currentAnswer}</div>`;fb.className='feedback wrong show';}

  const exp=document.getElementById('explanation');
  exp.innerHTML=`
    <div class="exp-answer">${currentAnswer}</div>
    <div class="exp-affix-box">
      <div class="affix-header">接辞チェック / Affix</div>
      <div class="affix-row">
        <span class="affix-chip">${currentAffix}</span>
        <span class="affix-ja">${currentAffixJa}</span>
      </div>
      <div class="affix-en">${currentAffixEn}</div>
    </div>`;
  exp.className='explanation show';
  document.getElementById('next-btn').className='next-btn show';
  document.getElementById('skip-btn').disabled=true;
}

function nextQuestion(){
  qIndex++;
  if(qIndex>=quiz.length) showResult(); else renderQuestion();
}

function showResult(){
  showScreen('result');
  const correct=quiz.length-sessionWrongWords.length;
  const wrong=sessionWrongWords.length;
  const total=quiz.length;
  const pct=Math.round(correct/total*100);
  document.getElementById('result-score').textContent=pct+'%';
  document.getElementById('res-correct').textContent=correct;
  document.getElementById('res-wrong').textContent=wrong;
  document.getElementById('res-total').textContent=total;
  let icon='🎉',title='素晴らしい！';
  if(pct<50){icon='💪';title='もう少し！';}else if(pct<80){icon='👍';title='よくできました！';}
  document.getElementById('result-icon').textContent=icon;
  document.getElementById('result-title').textContent=title;
  document.getElementById('result-sub').textContent=`${total}問中 ${correct}問正解`;
  const wl=document.getElementById('wrong-list');
  const ww=document.getElementById('wrong-review-wrap');
  if(sessionWrongWords.length>0){
    wl.innerHTML=sessionWrongWords.map(w=>`<div class="wrong-item"><span class="wrong-en">${w[0]}</span><span class="wrong-ja">${w[1]}</span></div>`).join('');
    ww.style.display='block';
  } else { ww.style.display='none'; }
}

// ── Init ──
document.getElementById('hdr-correct').textContent=totalCorrect;
document.getElementById('hdr-wrong').textContent=totalWrong;
document.getElementById('hdr-total').textContent=totalCorrect+totalWrong;
document.getElementById('word-count-badge').textContent=`全 ${WORDS.length} 語収載`;
showScreen('home');
</script>
